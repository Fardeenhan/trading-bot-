<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E17"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with squircle radius -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1E293B" stroke-width="4" />

  <!-- Background decorative candlestick lines -->
  <line x1="120" y1="200" x2="120" y2="340" stroke="#334155" stroke-width="3" stroke-dasharray="4 4" />
  <line x1="200" y1="160" x2="200" y2="380" stroke="#334155" stroke-width="3" stroke-dasharray="4 4" />
  <line x1="320" y1="140" x2="320" y2="360" stroke="#334155" stroke-width="3" stroke-dasharray="4 4" />
  <line x1="400" y1="180" x2="400" y2="320" stroke="#334155" stroke-width="3" stroke-dasharray="4 4" />

  <!-- Candlesticks in background -->
  <rect x="108" y="240" width="24" height="60" rx="4" fill="#EF4444" opacity="0.6"/>
  <rect x="188" y="210" width="24" height="110" rx="4" fill="#10B981" opacity="0.6"/>
  <rect x="308" y="190" width="24" height="90" rx="4" fill="#10B981" opacity="0.6"/>
  <rect x="388" y="220" width="24" height="70" rx="4" fill="#EF4444" opacity="0.6"/>

  <!-- Glowing Ascending Apex Line -->
  <path d="M 80 380 L 180 320 L 260 280 L 340 180 L 440 120" fill="none" stroke="url(#cyanGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" filter="url(#glow)"/>
  <path d="M 80 380 L 180 320 L 260 280 L 340 180 L 440 120" fill="none" stroke="url(#emeraldGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Apex Shield / Arrow in Center -->
  <g transform="translate(156, 120)">
    <!-- Outer Shield Halo -->
    <path d="M 100 20 L 180 60 L 180 140 C 180 200 100 240 100 240 C 100 240 20 200 20 140 L 20 60 Z" fill="#0F172A" stroke="#10B981" stroke-width="6" filter="url(#glow)"/>
    <!-- Inner Upward Arrow -->
    <path d="M 100 65 L 145 125 L 115 125 L 115 185 L 85 185 L 85 125 L 55 125 Z" fill="url(#emeraldGrad)"/>
    <!-- Accent Sparkle -->
    <polygon points="145,55 152,68 165,75 152,82 145,95 138,82 125,75 138,68" fill="#FACC15"/>
  </g>

  <!-- Typography -->
  <text x="256" y="445" font-family="'JetBrains Mono', 'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="900" fill="#F8FAFC" text-anchor="middle" letter-spacing="4">APEX TRADE</text>
  <text x="256" y="475" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#10B981" text-anchor="middle" letter-spacing="3">ZERO-LOSS PRO SIGNALS</text>
</svg>
